<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    #messages { scroll-behavior: smooth; }
    .msg-you { border-left: 3px solid #06b6d4; }
    .msg-assistant { border-left: 3px solid #10b981; }
    .msg-assistant.clarify { border-left: 3px solid #f59e0b; }
    .prose pre { background: #1e293b; padding: .75rem; border-radius: .375rem; overflow-x: auto; }
    .prose code { background: #1e293b; padding: .1em .3em; border-radius: .2em; font-size: .85em; }
    .prose p { margin-bottom: .5rem; }
    .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: .5rem; }
    .prose li { margin-bottom: .15rem; }
    .prose h1,.prose h2,.prose h3 { font-weight: 600; margin: .75rem 0 .4rem; }
    .prose table { border-collapse: collapse; width: 100%; margin-bottom: .5rem; }
    .prose th, .prose td { border: 1px solid #334155; padding: .3rem .6rem; text-align: left; }
    .prose th { background: #1e293b; }
    .chart-box { height: 300px; margin-bottom: .5rem; }
    .egeria-panel { max-height: 420px; overflow-y: auto; }
    .egeria-badge-ok  { background:#064e3b; color:#6ee7b7; }
    .egeria-badge-no  { background:#1e293b; color:#94a3b8; }
    .ann-group-header { font-weight:600; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:#f59e0b; margin:.5rem 0 .2rem; }
    .ann-row { padding:.2rem 0; border-bottom:1px solid #1e293b; font-size:.72rem; color:#cbd5e1; }
    .ann-rfa  { color:#fbbf24; }
    .survey-row-detail { background:#0f172a; border-radius:.25rem; padding:.5rem; margin:.25rem 0; display:none; }
    .survey-row-detail.open { display:block; }
    .project-btn.selected { background: #0e7490 !important; }
    .project-btn.compare-selected { background: #92400e !important; outline: 1px solid #f59e0b; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    /* Resizable sidebar */
    #resize-handle { width:4px; flex-shrink:0; cursor:col-resize; background:#1e293b; transition:background .15s; }
    #resize-handle:hover, #resize-handle.dragging { background:#0e7490; }
    /* Main view nav */
    #main-nav { border-bottom:1px solid #1e293b; background:#0f172a; }
    .main-nav-btn { padding:.35rem .9rem; font-size:.72rem; font-weight:500; color:#64748b; border-bottom:2px solid transparent; transition:color .15s,border-color .15s; white-space:nowrap; }
    .main-nav-btn.active { color:#22d3ee; border-bottom-color:#22d3ee; }
    .main-nav-btn:hover:not(.active) { color:#94a3b8; }
    /* Survey report */
    .rpt-section { margin-bottom:1.25rem; }
    .rpt-section-title { font-size:.65rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:#475569; margin-bottom:.4rem; }
    .rpt-card { background:#1e293b; border-radius:.375rem; padding:.6rem .75rem; text-align:center; }
    .rpt-card-val { font-size:1.15rem; font-weight:700; color:#22d3ee; }
    .rpt-card-lbl { font-size:.65rem; color:#64748b; margin-top:.1rem; }
    /* Catalog checkboxes */
    .catalog-cb { accent-color:#06b6d4; cursor:pointer; }
    .catalog-row { display:flex; align-items:center; gap:.4rem; padding:.15rem 0; font-size:.72rem; color:#94a3b8; cursor:pointer; }
    .catalog-row:hover { color:#e2e8f0; }
    /* Sidebar project action buttons */
    .proj-actions { opacity:0; transition:opacity .12s; display:flex; align-items:center; gap:2px; flex-shrink:0; }
    .project-btn:hover .proj-actions { opacity:1; }
    .proj-action-btn { position:relative; padding:2px 5px; border-radius:4px; font-size:.65rem; line-height:1; color:#64748b; background:transparent; border:none; cursor:pointer; transition:color .12s,background .12s; }
    .proj-action-btn:hover { color:#e2e8f0; background:#334155; }
    .proj-action-btn.spinning { animation:spin .8s linear infinite; display:inline-block; pointer-events:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* CSS tooltip for action buttons */
    .proj-action-btn[data-tip]::after { content:attr(data-tip); position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%); background:#1e293b; color:#e2e8f0; font-size:.6rem; white-space:nowrap; padding:2px 6px; border-radius:3px; pointer-events:none; opacity:0; transition:opacity .1s; border:1px solid #334155; }
    .proj-action-btn[data-tip]:hover::after { opacity:1; }
  </style>
</head>
<body class="dark bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

<!-- Header -->
<header class="flex items-center justify-between px-4 py-2 bg-slate-800 border-b border-slate-700 shrink-0">
  <div class="flex items-center gap-3">
    <img src="/static/pdr-logo.png" alt="PDR logo" class="h-8 w-8 rounded object-contain">
    <span class="text-cyan-400 font-bold text-lg">Project Explorer</span>
    <span id="scope-badge" class="hidden text-xs bg-cyan-900 text-cyan-300 px-2 py-0.5 rounded-full"></span>
  </div>
  <span class="text-xs text-slate-500">Multi-agent RAG · <a href="/docs" target="_blank" class="text-cyan-600 hover:underline">API docs</a></span>
</header>

<!-- Main layout -->
<div class="flex flex-1 overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="flex flex-col bg-slate-800 border-r border-slate-700 overflow-y-auto" style="width:24rem;min-width:12rem;max-width:50vw">
    <div class="px-3 pt-3 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Projects</div>

    <div class="px-2 pb-1">
      <button onclick="selectProject(null)"
        class="project-btn w-full text-left px-3 py-1.5 rounded text-sm text-slate-300 hover:bg-slate-700 transition-colors"
        data-slug="">
        All projects
      </button>
    </div>

    <div id="project-list" class="px-2 flex flex-col gap-0.5"></div>

    <!-- Charts section -->
    <div id="charts-section" class="hidden px-3 pt-3 pb-2 border-t border-slate-700 mt-2">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Charts</div>
      <div class="flex gap-1 flex-wrap mb-2">
        <button onclick="showChart('stars')"   class="chart-tab text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">Stars</button>
        <button onclick="showChart('commits')" class="chart-tab text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">Commits</button>
        <button onclick="showChart('languages')" class="chart-tab text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">Languages</button>
        <button onclick="showChart('health')"  class="chart-tab text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">Health</button>
        <button onclick="showChart('file_types')" class="chart-tab text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">File Types</button>
        <button onclick="showEgeria()" class="chart-tab text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">Egeria</button>
      </div>
      <div id="chart-container" class="chart-box rounded bg-slate-900"></div>
      <div id="egeria-panel" class="egeria-panel hidden"></div>
    </div>
  </aside>

  <div id="resize-handle" title="Drag to resize"></div>

  <!-- Chat panel -->
  <main class="flex flex-col flex-1 overflow-hidden">

    <!-- Main view tabs -->
    <div id="main-nav" class="hidden shrink-0 flex items-center">
      <button onclick="showMainView('chat')" id="nav-chat" class="main-nav-btn active">💬 Chat</button>
      <button onclick="showMainView('report')" id="nav-report" class="main-nav-btn">📊 Survey Report</button>
    </div>

    <!-- Chat view -->
    <div id="chat-view" class="flex flex-col flex-1 overflow-hidden">

    <!-- Messages -->
    <div id="messages" class="flex-1 overflow-y-auto px-4 py-3 space-y-3"></div>

    <!-- Thinking indicator -->
    <div id="thinking" class="hidden px-4 py-1">
      <div class="flex items-center gap-2 text-slate-400 text-sm">
        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce"></div>
        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce" style="animation-delay:.15s"></div>
        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce" style="animation-delay:.3s"></div>
        <span class="text-xs">Thinking…</span>
      </div>
    </div>

    </div><!-- /chat-view -->

    <!-- Survey report view -->
    <div id="report-view" class="flex-1 overflow-y-auto hidden p-4 space-y-2"></div>

    <!-- Input -->
    <div class="px-4 py-3 border-t border-slate-700 bg-slate-800 shrink-0">
      <div class="flex gap-2">
        <textarea id="query-input" rows="2"
          class="flex-1 resize-none bg-slate-700 text-slate-100 rounded-lg px-3 py-2 text-sm placeholder-slate-400 border border-slate-600 focus:outline-none focus:border-cyan-500 transition-colors"
          placeholder="Ask a question… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send-btn" onclick="sendQuery()"
          class="px-4 py-2 bg-cyan-700 hover:bg-cyan-600 text-white rounded-lg text-sm font-medium transition-colors self-end">
          Send
        </button>
      </div>
      <div class="mt-1 flex items-center justify-between">
        <span id="intent-badge" class="text-xs text-slate-500"></span>
        <span class="text-xs text-slate-600">Enter=send · Shift+Enter=newline · f=feedback</span>
      </div>
    </div>
  </main>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────────
let selectedProject = null;
let compareSet = new Set();   // slugs selected via Shift+click for multi-project mode
let lastQueryHash = null;
let lastAssistantEl = null;
let pendingClarification = null;   // { query } when agent asked for project
let currentChart = 'stars';
let _reportLoaded = false;

// Persistent session ID — survives page reload, gives the server a stable key
// for the ConversationAgent so memory carries across turns.
let sessionId = localStorage.getItem('pe_session_id');
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem('pe_session_id', sessionId);
}

// ── init ───────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadProjects();
  appendMessage('assistant', 'Welcome to **Project Explorer**! Select a project in the sidebar or ask a question across all projects.');
  document.getElementById('query-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'f' && document.activeElement.id !== 'query-input') feedback();
  });
});

// ── projects ───────────────────────────────────────────────────────────────────
async function loadProjects() {
  const res = await fetch('/api/projects/');
  const projects = await res.json();
  const list = document.getElementById('project-list');
  list.innerHTML = '';
  projects.forEach(p => {
    const colors = { active: 'text-green-400', indexing: 'text-yellow-400', error: 'text-red-400', paused: 'text-slate-500' };
    const color = colors[p.status] || 'text-slate-400';
    const btn = document.createElement('button');
    btn.className = 'project-btn w-full text-left px-3 py-1.5 rounded text-sm hover:bg-slate-700 transition-colors';
    btn.dataset.slug = p.slug;
    btn.dataset.githubUrl = p.github_url || '';
    btn.onclick = (e) => e.shiftKey ? toggleCompare(p.slug) : selectProject(p.slug);
    btn.innerHTML = `
      <div class="flex items-center justify-between gap-1 min-w-0">
        <div class="font-medium text-slate-200 truncate">${_esc(p.display_name)}</div>
        <div class="proj-actions">
          <button class="proj-action-btn" data-tip="Refresh &amp; profile"
            onclick="event.stopPropagation(); runRefreshFromSidebar('${_esc(p.slug)}', this)">🔄</button>
          <button class="proj-action-btn" data-tip="Run survey"
            onclick="event.stopPropagation(); runSurveyFromSidebar('${_esc(p.slug)}', this)">📊</button>
          ${p.github_url ? `<a class="proj-action-btn" href="${_esc(p.github_url)}" target="_blank"
            data-tip="Open on GitHub" onclick="event.stopPropagation()">↗</a>` : ''}
        </div>
      </div>
      <div class="text-xs ${color}">${p.status} · ${p.collections.length} collections</div>`;
    list.appendChild(btn);
  });
}

function selectProject(slug) {
  compareSet.clear();
  selectedProject = slug;
  document.querySelectorAll('.project-btn').forEach(b => {
    b.classList.remove('selected', 'compare-selected');
  });
  if (slug) {
    document.querySelector(`[data-slug="${slug}"]`)?.classList.add('selected');
    document.getElementById('scope-badge').textContent = slug;
    document.getElementById('scope-badge').classList.remove('hidden');
    document.getElementById('charts-section').classList.remove('hidden');
    document.getElementById('egeria-panel').classList.add('hidden');
    document.getElementById('chart-container').classList.remove('hidden');
    showChart(currentChart);
    document.getElementById('main-nav').classList.remove('hidden');
    _reportLoaded = false;
    showMainView('chat');
    if (pendingClarification) {
      const q = pendingClarification;
      pendingClarification = null;
      appendMessage('assistant', `Got it — scoping to **${slug}** and re-running your question…`);
      runQuery(q.query, slug);
    }
  } else {
    document.getElementById('scope-badge').classList.add('hidden');
    document.getElementById('charts-section').classList.add('hidden');
    document.getElementById('main-nav').classList.add('hidden');
    document.querySelectorAll('.project-btn[data-slug=""]').forEach(b => b.classList.add('selected'));
  }
}

async function runRefreshFromSidebar(slug, btn) {
  const orig = btn.textContent;
  btn.textContent = '⟳';
  btn.classList.add('spinning');
  btn.disabled = true;

  try {
    const res = await fetch(`/api/projects/${slug}/refresh`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      btn.textContent = '✓';
      btn.style.color = '#4ade80';
      // Reload survey report if it's the active view
      if (selectedProject === slug) { _reportLoaded = false; loadSurveyReport(); }
      setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.disabled = false; btn.classList.remove('spinning'); }, 2500);
    } else {
      btn.textContent = '✗';
      btn.title = data.error || 'Refresh failed';
      btn.style.color = '#f87171';
      setTimeout(() => { btn.textContent = orig; btn.title = ''; btn.style.color = ''; btn.disabled = false; btn.classList.remove('spinning'); }, 4000);
    }
  } catch(e) {
    btn.textContent = '✗';
    btn.style.color = '#f87171';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.disabled = false; btn.classList.remove('spinning'); }, 2500);
  }
}

async function runSurveyFromSidebar(slug, btn) {
  // Select the project so the report tab is in context
  selectProject(slug);

  // Show spinner on the button
  const orig = btn.textContent;
  btn.textContent = '⟳';
  btn.classList.add('spinning');
  btn.disabled = true;

  try {
    const res = await fetch(`/api/egeria/${slug}/survey`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      // Switch to report tab and reload it
      showMainView('report');
      _reportLoaded = false;
      loadSurveyReport();
      btn.textContent = '✓';
      btn.style.color = '#4ade80';
      setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.disabled = false; btn.classList.remove('spinning'); }, 2500);
    } else {
      btn.textContent = '✗';
      btn.style.color = '#f87171';
      setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.disabled = false; btn.classList.remove('spinning'); }, 2500);
    }
  } catch(e) {
    btn.textContent = '✗';
    btn.style.color = '#f87171';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.disabled = false; btn.classList.remove('spinning'); }, 2500);
  }
}

function toggleCompare(slug) {
  // Add primary project to compare set first if none selected
  if (selectedProject && !compareSet.has(selectedProject)) {
    compareSet.add(selectedProject);
  }
  if (compareSet.has(slug)) {
    compareSet.delete(slug);
    document.querySelector(`[data-slug="${slug}"]`)?.classList.remove('compare-selected');
  } else {
    compareSet.add(slug);
    document.querySelector(`[data-slug="${slug}"]`)?.classList.add('compare-selected');
  }
  // Update scope badge
  const badge = document.getElementById('scope-badge');
  if (compareSet.size >= 2) {
    badge.textContent = [...compareSet].join(' + ');
    badge.classList.remove('hidden');
    badge.classList.add('text-amber-300');
    document.getElementById('charts-section').classList.add('hidden');
  } else if (compareSet.size === 1) {
    const only = [...compareSet][0];
    badge.textContent = only;
    badge.classList.remove('hidden', 'text-amber-300');
    selectedProject = only;
    compareSet.clear();
    document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('selected', 'compare-selected'));
    document.querySelector(`[data-slug="${only}"]`)?.classList.add('selected');
    document.getElementById('charts-section').classList.remove('hidden');
    showChart(currentChart);
  } else {
    selectedProject = null;
    badge.classList.add('hidden');
    badge.classList.remove('text-amber-300');
  }
}

// ── charts ─────────────────────────────────────────────────────────────────────
async function showChart(type) {
  if (!selectedProject) return;
  currentChart = type;
  document.getElementById('egeria-panel').classList.add('hidden');
  const container = document.getElementById('chart-container');
  container.classList.remove('hidden');
  container.innerHTML = '<div class="h-full flex items-center justify-center text-slate-500 text-xs">Loading…</div>';
  // Highlight active tab
  document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('bg-cyan-800','text-white'));
  event?.target?.classList.add('bg-cyan-800','text-white');
  try {
    const res = await fetch(`/api/stats/${selectedProject}/charts/${type}`);
    if (!res.ok) { container.innerHTML = '<div class="h-full flex items-center justify-center text-slate-500 text-xs">No data — run refresh first</div>'; return; }
    const fig = await res.json();
    // Dark theme overrides
    fig.layout = fig.layout || {};
    Object.assign(fig.layout, {
      paper_bgcolor: '#0f172a', plot_bgcolor: '#0f172a',
      font: { color: '#94a3b8', size: 10 },
      margin: { l: 40, r: 10, t: 30, b: 30 },
      height: 280,
    });
    if (fig.layout.xaxis) fig.layout.xaxis.gridcolor = '#1e293b';
    if (fig.layout.yaxis) fig.layout.yaxis.gridcolor = '#1e293b';
    Plotly.newPlot(container, fig.data, fig.layout, { displayModeBar: false, responsive: true });
  } catch (e) {
    container.innerHTML = `<div class="h-full flex items-center justify-center text-red-400 text-xs">${e.message}</div>`;
  }
}

// ── Egeria tab ─────────────────────────────────────────────────────────────────
async function showEgeria() {
  if (!selectedProject) return;
  document.getElementById('chart-container').classList.add('hidden');
  const panel = document.getElementById('egeria-panel');
  panel.classList.remove('hidden');
  document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('bg-cyan-800','text-white'));
  event?.target?.classList.add('bg-cyan-800','text-white');
  panel.innerHTML = '<div class="text-slate-500 text-xs py-2">Loading Egeria status…</div>';
  try {
    const res = await fetch(`/api/egeria/${selectedProject}/status`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderEgeriaPanel(panel, data);
  } catch(e) {
    panel.innerHTML = `<div class="text-red-400 text-xs py-2">Failed to load: ${e.message}</div>`;
  }
}

function renderEgeriaPanel(panel, data) {
  const registered = data.is_registered;
  const badgeCls = registered ? 'egeria-badge-ok' : 'egeria-badge-no';
  const badgeText = registered ? '✓ Registered in Egeria' : '○ Not published';
  const guidRow = data.asset_guid
    ? `<div class="text-xs text-slate-400 mt-0.5 font-mono truncate">GUID: ${data.asset_guid}</div>`
    : '';

  // Survey history table
  let surveysHtml = '';
  if (data.surveys && data.surveys.length) {
    const rows = data.surveys.map((s, i) => {
      const ts = s.surveyed_at ? s.surveyed_at.replace('T',' ').substring(0,16)+' UTC' : '—';
      const count = s.annotation_count != null ? s.annotation_count : '—';
      const guid = s.egeria_report_guid || '—';
      const isLatest = i === 0;
      return `<tr class="border-t border-slate-800 text-xs">
        <td class="py-0.5 pr-2 text-slate-400 whitespace-nowrap">${ts}</td>
        <td class="py-0.5 pr-2 text-right text-slate-300">${count}</td>
        <td class="py-0.5 font-mono text-cyan-600 truncate max-w-[7rem]" title="${guid}">${guid.substring(0,8)}…</td>
        <td class="py-0.5 pl-1">
          <button onclick="toggleAnnotations(this,'${selectedProject}','${s.surveyed_at}','${guid}')"
            class="text-xs px-1.5 py-0.5 rounded bg-slate-700 hover:bg-cyan-800 text-slate-300">
            ${isLatest ? '▶ View' : '▶'}
          </button>
        </td>
      </tr>
      <tr><td colspan="4" class="p-0">
        <div class="survey-row-detail" id="detail-${guid.substring(0,8)}"></div>
      </td></tr>`;
    }).join('');
    surveysHtml = `
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-2 mb-1">Survey History</div>
      <table class="w-full">
        <thead><tr class="text-xs text-slate-500">
          <th class="text-left font-normal pb-0.5">Date (UTC)</th>
          <th class="text-right font-normal pr-2">Ann.</th>
          <th class="text-left font-normal">Report GUID</th>
          <th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } else {
    surveysHtml = `<div class="text-slate-500 text-xs mt-2">No surveys published yet.</div>`;
  }

  panel.innerHTML = `
    <div class="flex items-center justify-between mb-1">
      <span class="text-xs px-2 py-0.5 rounded font-medium ${badgeCls}">${badgeText}</span>
      <button id="publish-btn" onclick="publishSurvey()"
        class="text-xs px-2 py-0.5 rounded bg-cyan-800 hover:bg-cyan-700 text-white font-medium transition-colors">
        Publish survey →
      </button>
    </div>
    ${guidRow}
    <div id="publish-feedback" class="text-xs mt-1"></div>
    ${surveysHtml}`;
}

async function publishSurvey() {
  if (!selectedProject) return;
  const btn = document.getElementById('publish-btn');
  const fb  = document.getElementById('publish-feedback');
  btn.disabled = true;
  btn.textContent = 'Publishing…';
  fb.innerHTML = '<span class="text-slate-400">Running survey and publishing to Egeria — this may take up to a minute…</span>';
  try {
    const res = await fetch(`/api/egeria/${selectedProject}/publish`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      fb.innerHTML = `<span class="text-emerald-400">✓ Published — ${data.annotation_count} annotations · Report: <span class="font-mono">${(data.report_guid||'').substring(0,12)}…</span></span>`;
      // Refresh the panel to show updated survey list
      setTimeout(() => showEgeria(), 800);
    } else {
      const stage = data.stage ? ` (failed at ${data.stage} step)` : '';
      fb.innerHTML = `<span class="text-amber-400">✗ ${data.error || 'Unknown error'}${stage}</span>`;
      btn.disabled = false;
      btn.textContent = 'Retry →';
    }
  } catch(e) {
    fb.innerHTML = `<span class="text-red-400">Request failed: ${e.message}</span>`;
    btn.disabled = false;
    btn.textContent = 'Retry →';
  }
}

async function toggleAnnotations(btn, slug, surveyedAt, reportGuid) {
  const key = reportGuid.substring(0,8);
  const detail = document.getElementById(`detail-${key}`);
  if (!detail) return;
  if (detail.classList.contains('open')) {
    detail.classList.remove('open');
    btn.textContent = '▶';
    return;
  }
  detail.classList.add('open');
  btn.textContent = '▼';
  if (detail.dataset.loaded) return;   // already fetched
  detail.innerHTML = '<div class="text-slate-500 text-xs">Fetching annotations from Egeria…</div>';
  try {
    const params = new URLSearchParams({ surveyed_at: surveyedAt, report_guid: reportGuid });
    const res = await fetch(`/api/egeria/${slug}/annotations?${params}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      detail.innerHTML = `<div class="text-amber-400 text-xs">${err.detail || 'Egeria not reachable — set EGERIA_PLATFORM_URL in .env'}</div>`;
      return;
    }
    const data = await res.json();
    detail.innerHTML = renderAnnotations(data.annotations || []);
    detail.dataset.loaded = '1';
    // Render quality radar if present
    const qaDiv = detail.querySelector('.qa-radar');
    if (qaDiv) renderQualityRadar(qaDiv, JSON.parse(qaDiv.dataset.scores));
  } catch(e) {
    detail.innerHTML = `<div class="text-red-400 text-xs">${e.message}</div>`;
  }
}

function renderAnnotations(annotations) {
  if (!annotations.length) return '<div class="text-slate-500 text-xs">No annotations found.</div>';
  // Group by annotation_type
  const groups = {};
  for (const a of annotations) {
    const t = a.annotation_type || 'Unknown';
    if (!groups[t]) groups[t] = [];
    groups[t].push(a);
  }
  let html = '';
  for (const [type, items] of Object.entries(groups).sort()) {
    html += `<div class="ann-group-header">${type} (${items.length})</div>`;
    for (const a of items) {
      const isRfa = type === 'RequestForAction';
      const conf = a.confidence != null ? ` <span class="text-slate-500">[${a.confidence}]</span>` : '';
      const rowCls = isRfa ? 'ann-row ann-rfa' : 'ann-row';
      html += `<div class="${rowCls}">• ${_esc(a.summary)}${conf}`;
      if (a.explanation) html += `<div class="text-slate-500 pl-3">${_esc(a.explanation)}</div>`;
      const sub = a.subtype_data || {};
      if (sub.actionRequested) html += `<div class="text-amber-500 pl-3">→ ${_esc(sub.actionRequested)}</div>`;
      // Quality scores: embed radar div with data
      if (type === 'QualityScoreAnnotation' && sub.qualityScores && Object.keys(sub.qualityScores).length) {
        const encoded = _esc(JSON.stringify(sub.qualityScores));
        html += `<div class="qa-radar mt-1" style="height:140px" data-scores="${encoded}"></div>`;
      }
      html += `</div>`;
    }
  }
  return html;
}

function renderQualityRadar(el, scores) {
  const cats = Object.keys(scores);
  const vals = cats.map(k => scores[k]);
  Plotly.newPlot(el, [{
    type: 'scatterpolar', r: [...vals, vals[0]], theta: [...cats, cats[0]],
    fill: 'toself', fillcolor: 'rgba(6,182,212,0.15)',
    line: { color: '#06b6d4', width: 1.5 },
  }], {
    paper_bgcolor:'#0f172a', plot_bgcolor:'#0f172a',
    polar: { bgcolor:'#0f172a', radialaxis:{ visible:true, range:[0,100], color:'#475569', gridcolor:'#1e293b', tickfont:{size:7,color:'#64748b'} }, angularaxis:{color:'#475569',gridcolor:'#1e293b'} },
    font:{ color:'#94a3b8', size:8 }, margin:{ l:30, r:30, t:10, b:10 },
  }, { displayModeBar:false, responsive:true });
}

function _esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── chat ───────────────────────────────────────────────────────────────────────
async function sendQuery() {
  const input = document.getElementById('query-input');
  const query = input.value.trim();
  if (!query) return;
  input.value = '';
  appendMessage('you', query);
  // If awaiting clarification, treat input as the project name
  if (pendingClarification) {
    const origQuery = pendingClarification.query;
    pendingClarification = null;
    const slug = query.replace(/^project:/i, '').trim().replace(/\s+/g, '_').toLowerCase();
    appendMessage('assistant', `Scoping to **${slug}**…`);
    runQuery(origQuery, slug);
    return;
  }
  // In compare mode, prefix query with project names to trigger CompareAgent/IntegrationAgent
  if (compareSet.size >= 2) {
    const slugList = [...compareSet];
    const prefixed = slugList.join(' and ') + ': ' + query;
    runQuery(prefixed, null);
  } else {
    runQuery(query, selectedProject);
  }
}

async function runQuery(query, projectSlug) {
  setThinking(true);
  document.getElementById('intent-badge').textContent = '';

  // Create a placeholder message to stream into
  const messages = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-assistant pl-3 pr-2 py-2 rounded-r-lg bg-slate-800/60';
  const header = document.createElement('div');
  header.className = 'text-xs font-semibold mb-1 text-emerald-400';
  header.textContent = 'Assistant';
  wrap.appendChild(header);
  const body = document.createElement('div');
  body.className = 'prose prose-invert text-sm text-slate-200 max-w-none';
  wrap.appendChild(body);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  lastAssistantEl = wrap;

  let accumulated = '';
  try {
    const res = await fetch('/api/query/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, project_slug: projectSlug, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // Parse complete SSE lines (each ends with \n\n)
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!line.startsWith('data:')) continue;
        const event = JSON.parse(line.slice(5).trim());

        if (event.t === 'chunk') {
          accumulated += event.v;
          // Show plain text while streaming; markdown on done
          body.textContent = accumulated;
          messages.scrollTop = messages.scrollHeight;

        } else if (event.t === 'done') {
          lastQueryHash = event.hash;
          document.getElementById('intent-badge').textContent = `intent: ${event.intent}`;

          // Re-render as markdown
          const isClarification = accumulated.startsWith('Which project are you asking about?');
          if (isClarification) {
            wrap.classList.add('clarify');
            header.className = 'text-xs font-semibold mb-1 text-amber-400';
            header.textContent = 'Assistant · clarification needed';
            pendingClarification = { query };
          }
          body.innerHTML = marked.parse(accumulated);

          // Inline chart if provided
          if (event.chart) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'mt-2 rounded bg-slate-900';
            chartDiv.style.height = '240px';
            wrap.appendChild(chartDiv);
            const fig = event.chart;
            fig.layout = fig.layout || {};
            Object.assign(fig.layout, {
              paper_bgcolor: '#0f172a', plot_bgcolor: '#0f172a',
              font: { color: '#94a3b8', size: 10 },
              margin: { l: 40, r: 10, t: 30, b: 30 },
              height: 230,
            });
            if (fig.layout.xaxis) fig.layout.xaxis.gridcolor = '#1e293b';
            if (fig.layout.yaxis) fig.layout.yaxis.gridcolor = '#1e293b';
            requestAnimationFrame(() => {
              Plotly.newPlot(chartDiv, fig.data, fig.layout, { displayModeBar: false, responsive: true });
            });
          }

          // Symbol table for code_inventory queries
          if (event.symbol_table && event.symbol_table.items && event.symbol_table.items.length) {
            const st = event.symbol_table;
            const tableId = `sym-table-${Date.now()}`;
            const tableWrap = document.createElement('div');
            tableWrap.className = 'mt-3 overflow-x-auto rounded border border-slate-700';
            const caption = `${st.total} ${st.kind === 'all' ? 'symbol' : st.kind}(s) in ${st.project}` +
              (st.total > st.items.length ? ` — showing first ${st.items.length}` : '');
            tableWrap.innerHTML = `
              <div class="px-3 py-1.5 bg-slate-800 text-xs text-slate-400 flex justify-between items-center gap-2 flex-wrap">
                <span>${caption}</span>
                <input type="search" placeholder="Filter…" oninput="filterSymTable(this,'${tableId}')"
                  class="ml-auto px-2 py-0.5 rounded bg-slate-700 border border-slate-600 text-slate-200 text-xs w-36 focus:outline-none focus:border-slate-400 placeholder-slate-500" />
              </div>
              <table class="w-full text-xs" id="${tableId}">
                <thead class="bg-slate-800/80 text-slate-400">
                  <tr>
                    <th class="px-2 py-1 text-left cursor-pointer hover:text-slate-200 select-none" onclick="sortSymTable(this,0)">Kind ↕</th>
                    <th class="px-2 py-1 text-left cursor-pointer hover:text-slate-200 select-none" onclick="sortSymTable(this,1)">Name ↕</th>
                    <th class="px-2 py-1 text-left cursor-pointer hover:text-slate-200 select-none hidden sm:table-cell" onclick="sortSymTable(this,2)">Signature ↕</th>
                    <th class="px-2 py-1 text-left cursor-pointer hover:text-slate-200 select-none hidden md:table-cell" onclick="sortSymTable(this,3)">File ↕</th>
                    <th class="px-2 py-1 text-left text-slate-600 hidden lg:table-cell">Purpose</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-700/50">
                  ${st.items.map(s => `
                    <tr class="hover:bg-slate-700/30 transition-colors">
                      <td class="px-2 py-1 text-cyan-400 font-mono">${s.kind}</td>
                      <td class="px-2 py-1 text-slate-200 font-mono">${s.name}</td>
                      <td class="px-2 py-1 text-slate-400 font-mono truncate max-w-xs hidden sm:table-cell">${s.signature}</td>
                      <td class="px-2 py-1 text-slate-500 truncate max-w-xs hidden md:table-cell">${s.file}:${s.line}</td>
                      <td class="px-2 py-1 text-slate-500 truncate max-w-xs hidden lg:table-cell">${s.doc}</td>
                    </tr>`).join('')}
                </tbody>
              </table>`;
            wrap.appendChild(tableWrap);
          }

          // compare_symbols: side-by-side API surface diff for comparison queries
          if (event.compare_symbols && event.compare_symbols.sides && event.compare_symbols.sides.length >= 2) {
            const cs = event.compare_symbols;
            const [a, b] = cs.sides;
            const kindLabel = cs.kind === 'all' ? 'symbol' : cs.kind;
            const allKinds = [...new Set([...Object.keys(a.counts), ...Object.keys(b.counts)])].sort();

            const renderSide = (side) => {
              const countRows = allKinds.map(k => `
                <tr class="hover:bg-slate-700/20">
                  <td class="px-2 py-0.5 text-cyan-400 font-mono">${k}</td>
                  <td class="px-2 py-0.5 text-right text-slate-300">${side.counts[k] ?? 0}</td>
                </tr>`).join('');
              const itemRows = side.items.map(s => `
                <tr class="hover:bg-slate-700/30 transition-colors">
                  <td class="px-2 py-1 text-cyan-400 font-mono text-xs">${s.kind}</td>
                  <td class="px-2 py-1 text-slate-200 font-mono text-xs truncate max-w-[12rem]">${s.name}</td>
                  <td class="px-2 py-1 text-slate-500 text-xs truncate max-w-[10rem] hidden md:table-cell">${s.file}</td>
                </tr>`).join('');
              return `
                <div class="flex-1 min-w-0">
                  <div class="px-2 py-1 bg-slate-800 text-xs font-semibold text-emerald-400 border-b border-slate-700">${side.slug} — ${side.total} ${kindLabel}(s)</div>
                  <table class="w-full text-xs mb-1">
                    <tbody class="divide-y divide-slate-700/30">${countRows}</tbody>
                  </table>
                  <div class="px-2 py-0.5 text-xs text-slate-500 bg-slate-800/50">${side.items.length < side.total ? `Top ${side.items.length}` : 'All'} ${kindLabel}s</div>
                  <table class="w-full text-xs">
                    <tbody class="divide-y divide-slate-700/30">${itemRows}</tbody>
                  </table>
                </div>`;
            };

            const csWrap = document.createElement('div');
            csWrap.className = 'mt-3 rounded border border-slate-700 overflow-hidden';
            csWrap.innerHTML = `
              <div class="px-3 py-1.5 bg-slate-800 text-xs text-slate-400">API surface comparison — ${kindLabel}s</div>
              <div class="flex gap-px bg-slate-700">
                ${renderSide(a)}
                ${renderSide(b)}
              </div>`;
            wrap.appendChild(csWrap);
          }

          // Alias suggestion banner
          if (event.alias_suggestion) {
            const as = event.alias_suggestion;
            const banner = document.createElement('div');
            banner.className = 'mt-2 flex items-center gap-2 rounded bg-amber-900/40 border border-amber-700/50 px-3 py-1.5 text-xs text-amber-300';
            banner.innerHTML = `
              <span><strong>"${as.term}"</strong> looks like <strong>${as.candidate_name}</strong>. Remember this alias?</span>
              <button class="ml-auto px-2 py-0.5 rounded bg-amber-700/60 hover:bg-amber-600 text-white transition-colors"
                onclick="confirmAlias('${as.term}', '${as.candidate_slug}', this.parentElement)">Yes</button>
              <button class="px-2 py-0.5 rounded text-amber-500 hover:text-amber-300 transition-colors"
                onclick="this.parentElement.remove()">No</button>`;
            wrap.appendChild(banner);
          }

          // Feedback buttons
          if (event.hash) {
            const fb = document.createElement('div');
            fb.className = 'mt-1.5 flex gap-2';
            fb.innerHTML = `
              <button onclick="recordFeedback('${event.hash}', 1, this)" class="text-xs text-slate-500 hover:text-green-400 transition-colors">👍</button>
              <button onclick="recordFeedback('${event.hash}', -1, this)" class="text-xs text-slate-500 hover:text-red-400 transition-colors">👎</button>`;
            wrap.appendChild(fb);
          }
          messages.scrollTop = messages.scrollHeight;
        }
      }
    }
  } catch (e) {
    body.innerHTML = marked.parse(`**Error:** ${e.message}`);
  } finally {
    setThinking(false);
  }
}

function appendMessage(role, text, opts = {}) {
  const messages = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `msg-${role} pl-3 pr-2 py-2 rounded-r-lg bg-slate-800/60 ${opts.clarify ? 'clarify' : ''}`;

  const header = document.createElement('div');
  header.className = 'text-xs font-semibold mb-1 ' + (role === 'you' ? 'text-cyan-400' : opts.clarify ? 'text-amber-400' : 'text-emerald-400');
  header.textContent = role === 'you' ? 'You' : opts.clarify ? 'Assistant · clarification needed' : 'Assistant';
  wrap.appendChild(header);

  const body = document.createElement('div');
  body.className = 'prose prose-invert text-sm text-slate-200 max-w-none';
  body.innerHTML = marked.parse(text);
  wrap.appendChild(body);

  // chart and feedback buttons are injected by runQuery() after the stream completes

  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return wrap;
}

async function recordFeedback(hash, vote, btn) {
  await fetch('/api/query/feedback', {
    method: 'POST',

    body: JSON.stringify({ query_hash: hash, vote }),
  });
  btn.parentElement.innerHTML = vote > 0
    ? '<span class="text-xs text-green-400">👍 Thanks!</span>'
    : '<span class="text-xs text-red-400">👎 Noted.</span>';
}

function sortSymTable(th, colIdx) {
  const table = th.closest('table');
  const tbody = table.querySelector('tbody');
  const rows = [...tbody.querySelectorAll('tr')];
  const asc = th.dataset.sortAsc !== 'true';
  th.dataset.sortAsc = asc;
  rows.sort((a, b) => {
    const av = a.cells[colIdx]?.textContent.trim() || '';
    const bv = b.cells[colIdx]?.textContent.trim() || '';
    return asc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  rows.forEach(r => tbody.appendChild(r));
}

function filterSymTable(input, tableId) {
  const q = input.value.toLowerCase();
  const table = document.getElementById(tableId);
  if (!table) return;
  table.querySelectorAll('tbody tr').forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(q) ? '' : 'none';
  });
}

async function confirmAlias(term, slug, banner) {

  });
  banner.innerHTML = `<span class="text-amber-400">Alias saved — "${term}" will resolve to ${slug} in future queries.</span>`;
  setTimeout(() => banner.remove(), 3000);
}

function feedback() {

// ── resize ────────────────────────────────────────────────────────────────────
(function _initResize() {
  const handle = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');
  if (!handle || !sidebar) return;
  const stored = localStorage.getItem('pe_sidebar_w');
  if (stored) sidebar.style.width = stored + 'px';
  let dragging = false;
  handle.addEventListener('mousedown', e => {
    dragging = true;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(192, Math.min(e.clientX, window.innerWidth * 0.6));
    sidebar.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    localStorage.setItem('pe_sidebar_w', parseInt(sidebar.style.width));
  });
})();

function showMainView(tab) {
  const chatView   = document.getElementById('chat-view');

  const navChat    = document.getElementById('nav-chat');

  if (data.file_types && data.file_types.length) {
    html += `<div class="rpt-section">
      <div class="rpt-section-title">File Types <span class="text-slate-600 ml-1 normal-case font-normal text-xs">(check rows to catalog in Egeria)</span></div>
      <div id="rpt-file-chart" style="height:220px" class="rounded bg-slate-900 mb-2"></div>
      <div class="space-y-0" id="rpt-file-list">`;
    for (const ft of data.file_types) {
      const pct = data.total_files > 0 ? Math.round(ft.count / data.total_files * 100) : 0;
      const extsObj = ft.extensions || {};
      const extKeys = Object.keys(extsObj).sort((a,b) => extsObj[b]-extsObj[a]).slice(0,5);
      const extStr  = extKeys.join(', ');
      const extsJson = JSON.stringify(extKeys).replace(/'/g,"&#39;");
      html += `<label class="catalog-row">
        <input type="checkbox" class="catalog-cb"
          data-label="${_esc(ft.label)}" data-count="${ft.count}" data-exts='${extsJson}'>
        <span class="flex-1 truncate text-slate-200">${_esc(ft.label)}</span>
        <span class="text-slate-400 tabular-nums">${ft.count}</span>
        <span class="text-slate-600 tabular-nums w-10 text-right">${pct}%</span>
        ${extStr ? `<span class="text-slate-600 text-xs ml-2 truncate max-w-24 hidden sm:inline">${_esc(extStr)}</span>` : ''}
      </label>`;
    }
    html += `</div>
      <div class="mt-2 flex items-center gap-2">
        <button onclick="catalogSelected()"
          class="text-xs px-2.5 py-1 rounded bg-cyan-800 hover:bg-cyan-700 text-white font-medium transition-colors">
          Catalog selected →
        </button>
        <span id="catalog-feedback" class="text-xs text-slate-500"></span>
      </div>
    </div>`;
  }

  // Data profiles section
  // Match labels from FileTypeCache: "CSV Data File", "Excel Spreadsheet", "Parquet Data File", etc.
  const _dataKeywords = ['csv','excel','parquet','avro','orc','arrow','hdf','numpy','json line','sqlite','duckdb','pickle','data file'];
  const hasDataFiles = (data.file_types || []).some(ft =>
    _dataKeywords.some(kw => ft.label.toLowerCase().includes(kw))
  );
  if (data.data_profiles && data.data_profiles.length) {
    const profiled = data.data_profiles.filter(p => p.row_count != null);
    const unprofiledCount = data.data_profiles.length - profiled.length;
    html += `<div class="rpt-section">
      <div class="rpt-section-title">Data Files
        <span class="text-slate-600 ml-1 normal-case font-normal text-xs">${data.data_profiles.length} file(s)</span>
      </div>`;
    if (profiled.length) {
      html += `<div class="space-y-2">`;
      for (const p of profiled) {
        const sizeKb = p.file_size_bytes > 0 ? (p.file_size_bytes >= 1048576
          ? (p.file_size_bytes/1048576).toFixed(1)+' MB'
          : (p.file_size_bytes/1024).toFixed(0)+' KB') : '';
        const colCount = p.col_count ?? 0;
        const shownCols = (p.columns || []).slice(0, 6);
        const moreCols = colCount - shownCols.length;
        const colPills = shownCols.map(c => {
          const nullBadge = c.null_pct > 50 ? ' text-amber-400' : ' text-slate-500';
          return `<span class="inline-flex items-center gap-1 text-xs bg-slate-800 rounded px-1.5 py-0.5">
            <span class="text-slate-200">${_esc(c.name)}</span>
            <span class="${nullBadge}">${_esc(c.dtype)}</span>
            ${c.null_pct > 0 ? `<span class="text-slate-600">${c.null_pct}%∅</span>` : ''}
          </span>`;
        }).join('');
        html += `<div class="rounded bg-slate-800 px-3 py-2 space-y-1">
          <div class="flex items-baseline justify-between gap-2">
            <span class="text-slate-200 text-xs font-mono truncate">${_esc(p.file_path)}</span>
            <span class="text-slate-500 text-xs whitespace-nowrap">${_esc(p.format)}${sizeKb ? ' · '+sizeKb : ''}</span>
          </div>
          <div class="text-xs text-slate-400">${(p.row_count??0).toLocaleString()} rows × ${colCount} columns</div>
          ${p.null_summary ? `<div class="text-xs text-amber-400/80">⚠ ${_esc(p.null_summary)}</div>` : ''}
          <div class="flex flex-wrap gap-1 mt-1">${colPills}${moreCols > 0 ? `<span class="text-xs text-slate-600">+${moreCols} more</span>` : ''}</div>
        </div>`;
      }
      html += `</div>`;
    }
    if (unprofiledCount > 0) {
      html += `<div class="text-xs text-slate-600 mt-1">${unprofiledCount} file(s) not profiled (too large or unsupported format)</div>`;
    }
    html += `</div>`;
  } else if (hasDataFiles) {
    html += `<div class="rpt-section">
      <div class="rpt-section-title">Data Files</div>
      <div class="text-xs text-slate-500 bg-slate-900 rounded px-3 py-2.5">
        Data file inventory detected but no column profiles yet.<br>
        Run <code class="text-cyan-400 font-mono">project-explorer refresh ${_esc(data.slug)}</code>
        to profile CSV, Excel, and Parquet files (column names, row counts, null rates).
      </div>
    </div>`;
  }

  // Dependencies section
  if (data.dependencies && data.dependencies.length) {
    html += `<div class="rpt-section">
      <div class="rpt-section-title">Dependencies by Ecosystem</div>
      <div id="rpt-dep-chart" style="height:${Math.max(140, Math.min(data.dependencies.length, 8) * 28)}px" class="rounded bg-slate-900 mb-2"></div>
      <div class="grid grid-cols-3 gap-1.5">`;
    for (const d of data.dependencies.slice(0, 6)) {
      html += `<div class="rpt-card">
        <div class="rpt-card-val">${d.count}</div>
        <div class="rpt-card-lbl">${_esc(d.ecosystem)}</div>
        <div class="text-xs text-slate-600 mt-0.5">${d.direct} direct</div>
      </div>`;
    }
    html += `</div></div>`;
  }

  if (h.last_push) {
    html += `<div class="text-xs text-slate-600">Last push: ${_esc(h.last_push.substring(0,10))}</div>`;
  }

  view.innerHTML = html;

  // Render file types donut
  if (data.file_types && data.file_types.length) {
    const ftEl = document.getElementById('rpt-file-chart');
    if (ftEl) {
      const top = data.file_types.slice(0, 14);
      Plotly.newPlot(ftEl, [{
        type: 'pie',
        labels: top.map(f => f.label),
        values: top.map(f => f.count),
        hole: 0.42,
        textinfo: 'label+percent',
        textfont: { size: 9, color: '#cbd5e1' },
        marker: { colors: [
          '#06b6d4','#0891b2','#0e7490','#155e75','#164e63',
          '#0369a1','#0284c7','#38bdf8','#67e8f9','#a5f3fc',
          '#22d3ee','#7dd3fc','#bae6fd','#e0f2fe',
        ]},
      }], {
        paper_bgcolor:'#0f172a', plot_bgcolor:'#0f172a',
        font:{ color:'#94a3b8', size:9 },
        margin:{ l:10, r:10, t:16, b:10 },
        showlegend: false,
        height: 210,
      }, { displayModeBar:false, responsive:true });
    }
  }

  // Render dependencies bar chart
  if (data.dependencies && data.dependencies.length) {
    const depEl = document.getElementById('rpt-dep-chart');
    if (depEl) {
      const deps = data.dependencies.slice(0, 8);
      Plotly.newPlot(depEl, [
        { type:'bar', orientation:'h', name:'Total',
          x: deps.map(d => d.count), y: deps.map(d => d.ecosystem),
          marker:{ color:'#0891b2' } },
        { type:'bar', orientation:'h', name:'Direct',
          x: deps.map(d => d.direct), y: deps.map(d => d.ecosystem),
          marker:{ color:'#06b6d4' } },
      ], {
        paper_bgcolor:'#0f172a', plot_bgcolor:'#0f172a',
        barmode: 'overlay',
        font:{ color:'#94a3b8', size:9 },
        margin:{ l:80, r:20, t:10, b:20 },
        xaxis:{ gridcolor:'#1e293b' },
        yaxis:{ gridcolor:'#1e293b' },
        legend:{ font:{ size:8, color:'#64748b' }, x:0.7, y:1 },
        height: depEl.style.height ? parseInt(depEl.style.height) - 10 : 140,
      }, { displayModeBar:false, responsive:true });
    }
  }
}

function askAboutSurvey() {
  showMainView('chat');
  const input = document.getElementById('query-input');
  input.value = `Summarize the survey results for ${selectedProject}`;
  input.focus();
}

async function catalogSelected() {
  if (!selectedProject) return;
  const checkboxes = [...document.querySelectorAll('#rpt-file-list .catalog-cb:checked')];
  const fb = document.getElementById('catalog-feedback');
  if (!checkboxes.length) {
    fb.textContent = 'Select at least one file type first.';
    return;
  }
  const elements = checkboxes.map(cb => ({
    label:      cb.dataset.label,
    file_count: parseInt(cb.dataset.count) || 0,
    extensions: (() => { try { return JSON.parse(cb.dataset.exts || '[]'); } catch{ return []; } })(),
  }));
  fb.textContent = `Cataloging ${elements.length} element(s)…`;
  try {
    const res = await fetch(`/api/egeria/${selectedProject}/catalog-elements`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ elements }),
    });
    const data = await res.json();
    if (data.status === 'ok') {
      fb.innerHTML = `<span class="text-emerald-400">✓ Cataloged ${data.cataloged.length} element(s) in Egeria</span>`;
      checkboxes.forEach(cb => { cb.checked = false; });
    } else {
      const errs = (data.cataloged || [])
        .filter(c => c.status === 'error')
        .map(c => `${c.label}: ${c.error}`)
        .join('; ');
      fb.innerHTML = `<span class="text-amber-400">⚠ ${data.status} — ${errs || (data.cataloged[0]?.error || 'unknown error')}</span>`;
    }
  } catch(e) {
    fb.innerHTML = `<span class="text-red-400">Request failed: ${e.message}</span>`;
  }
}

// ── utils ──────────────────────────────────────────────────────────────────────
function setThinking(on) {
  document.getElementById('thinking').classList.toggle('hidden', !on);
  document.getElementById('send-btn').disabled = on;
  document.getElementById('send-btn').classList.toggle('opacity-50', on);
}
